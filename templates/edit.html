<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Student</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="container narrow">
  <section class="card">
    <h1>Edit Student</h1>
    <form method="post" class="form-grid">
      <input name="enrollment" value="{{ student.enrollment }}" placeholder="Enrollment number" required>
      <input name="name" value="{{ student.name }}" placeholder="Student name" required>
      <input type="number" name="age" value="{{ student.age }}" min="1" required>
      <input name="course" value="{{ student.course }}" placeholder="Course" required>
      <input type="number" name="marks" value="{{ student.marks }}" min="0" max="100" step="0.01" required>
      <button type="submit">Save Changes</button>
      <a class="button secondary" href="{{ url_for('index') }}">Cancel</a>
    </form>
  </section>
</main>
</body>
</html>
